version: 2
updates:
  # Dev dependency (vscode-oniguruma, used only by Node tests) + any future deps
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Keep GitHub Actions in the workflows up to date
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
